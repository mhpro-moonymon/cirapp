name: chat_app
description: تطبيق محادثة باستخدام Flutter و Laravel

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP للتواصل مع API
  http: ^1.1.0
  
  # إدارة الحالة
  provider: ^6.1.1
  
  # التنقل
  go_router: ^12.1.3
  
  # تخزين محلي
  shared_preferences: ^2.2.2
  
  # JSON
  json_annotation: ^4.8.1
  
  # WebSocket للمحادثات الفورية
  web_socket_channel: ^2.4.0
  
  # تحميل الصور
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  
  # UI
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  
  # الوقت والتاريخ
  intl: ^0.18.1
  timeago: ^3.6.0
  
  # الإشعارات المحلية
  flutter_local_notifications: ^16.3.2
  
  # الصوتيات
  just_audio: ^0.9.36
  audio_waveforms: ^1.0.5
  
  # الملفات
  file_picker: ^6.1.1
  path_provider: ^2.1.1
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700